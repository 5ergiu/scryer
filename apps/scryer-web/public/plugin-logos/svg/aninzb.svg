  <path d="M32 40 C32 47 32.6 52 34.5 56 C35.3 57.6 37.2 56.8 36.7 55.2 C35.2 51 34.8 46.5 35 39.8 Z" fill="url(#tent)"/>
  <path d="M38 39.5 C38.4 46 40 50.5 43.5 54 C44.8 55.2 46.5 53.8 45.5 52.4 C42.6 49 41.4 45 41.2 39 Z" fill="url(#tent)"/>
  <path d="M44 38 C45 44 47 48 51 51 C52.4 52 54 50.6 53 49.2 C50 46.5 48.4 43 47.6 37.5 Z" fill="url(#tent)"/>
</svg>
