<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241238"/>
      <stop offset="1" stop-color="#110821"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b18cff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d3fd4"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4ee0"/>
      <stop offset="1" stop-color="#5a2fb8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b34b0"/>
      <stop offset="1" stop-color="#40217f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9f24b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c9f24b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- wings -->
  <path d="M15 30 C8 24 6 16 8 10 C12 15 15 17 18 22 C15 19 12 18 10 17 C13 21 15 25 18 29 Z" fill="url(#wing)"/>
  <path d="M49 30 C56 24 58 16 56 10 C52 15 49 17 46 22 C49 19 52 18 54 17 C51 21 49 25 46 29 Z" fill="url(#wing)"/>

  <!-- head -->
  <path d="M32 8 C21 8 14 16 14 26 C14 33 18 38 24 40 L40 40 C46 38 50 33 50 26 C50 16 43 8 32 8 Z" fill="url(#body)"/>

  <!-- eye glow -->
  <circle cx="24" cy="26" r="8" fill="url(#glow)"/>
  <circle cx="40" cy="26" r="8" fill="url(#glow)"/>

  <!-- eyes -->
  <path d="M19 26 C21 22.6 27 22.6 29 26 C27 29.4 21 29.4 19 26 Z" fill="#0c0518"/>
  <path d="M35 26 C37 22.6 43 22.6 45 26 C43 29.4 37 29.4 35 26 Z" fill="#0c0518"/>
  <circle cx="24" cy="26" r="2" fill="#c9f24b"/>
  <circle cx="40" cy="26" r="2" fill="#c9f24b"/>

  <!-- tentacles -->
  <path d="M20 38 C19 44 17 48 13 51 C11.6 52 10 50.6 11 49.2 C14 46.5 15.6 43 16.4 37.5 Z" fill="url(#tent)"/>
  <path d="M26 39.5 C25.6 46 24 50.5 20.5 54 C19.2 55.2 17.5 53.8 18.5 52.4 C21.4 49 22.6 45 22.8 39 Z" fill="url(#tent)"/>
